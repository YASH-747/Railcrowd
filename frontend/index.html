<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RailCrowd — Real-time Crowding for Indian Railways</title>
<style>
  :root{
    --bg:#0a0f1e; --panel:#111a2e; --panel2:#16223a; --border:#22314f;
    --text:#e6edf7; --muted:#8ba0c0; --accent:#ff7a18; --sky:#38bdf8;
    --low:#22c55e; --mod:#38bdf8; --high:#f59e0b; --crit:#ef4444;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(1200px 600px at 80% -10%, #13203a 0%, var(--bg) 55%) fixed, var(--bg);
    color:var(--text);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Ubuntu,sans-serif;
  }
  a{color:var(--sky);text-decoration:none}
  .wrap{max-width:1120px;margin:0 auto;padding:0 20px}

  /* header */
  header{position:sticky;top:0;z-index:50;background:rgba(10,15,30,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
  .hdr{display:flex;align-items:center;gap:18px;height:62px}
  .backbtn{display:none;width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--panel);
    color:var(--text);font-size:18px;font-weight:800;cursor:pointer;align-items:center;justify-content:center;flex:0 0 auto}
  .backbtn:hover{background:var(--panel2);border-color:var(--accent)}
  .backlink{display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-size:13px;font-weight:700;cursor:pointer;margin:14px 0 0}
  .backlink:hover{color:var(--text)}
  .brand{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
  .brand .logo{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-weight:800;color:#fff;
    background:linear-gradient(135deg,var(--accent),#ffb04d)}
  .brand .t{font-weight:800;font-size:17px;letter-spacing:.2px}
  .brand .t span{color:var(--accent)}
  .brand .sub{font-size:11px;color:var(--muted);margin-top:-3px}
  nav{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
  nav a{padding:7px 12px;border-radius:8px;color:var(--muted);font-size:13.5px;font-weight:600}
  nav a:hover{color:var(--text);background:var(--panel2)}
  nav a.on{color:#fff;background:var(--panel2)}
  .livepill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--low);
    background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);padding:3px 9px;border-radius:99px}
  .livepill .dot{width:7px;height:7px;border-radius:50%;background:var(--low);animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(34,197,94,.5)}50%{opacity:.5;box-shadow:0 0 0 6px rgba(34,197,94,0)}}

  /* hero */
  .hero{padding:44px 0 26px}
  .hero h1{font-size:30px;margin:0 0 8px;line-height:1.2}
  .hero h1 em{font-style:normal;color:var(--accent)}
  .hero p{color:var(--muted);max-width:640px;margin:0 0 22px;font-size:15.5px}
  .search{display:flex;gap:10px;max-width:640px}
  .search input{flex:1;background:var(--panel);border:1px solid var(--border);border-radius:12px;color:var(--text);
    padding:14px 16px;font-size:15px;outline:none}
  .search input:focus{border-color:var(--accent)}
  .search button{background:var(--accent);color:#1a1206;border:0;border-radius:12px;padding:0 22px;font-weight:800;font-size:14.5px;cursor:pointer}
  .search button:hover{filter:brightness(1.08)}
  .sug{position:relative;max-width:640px}
  .sugbox{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--border);
    border-radius:12px;overflow:hidden;z-index:40;box-shadow:0 18px 50px rgba(0,0,0,.5);display:none}
  .sugbox .row{padding:11px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;border-bottom:1px solid var(--border)}
  .sugbox .row:last-child{border-bottom:0}
  .sugbox .row:hover{background:var(--panel2)}
  .sugbox .row .kind{font-size:10px;font-weight:800;color:#1a1206;background:var(--sky);border-radius:5px;padding:2px 6px}
  .sugbox .row .kind.st{background:var(--accent)}
  .sugbox .row .nm{flex:1}
  .sugbox .row .sub2{color:var(--muted);font-size:12.5px}

  /* stats */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:26px 0 30px}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px}
  .stat .n{font-size:24px;font-weight:800}
  .stat .l{color:var(--muted);font-size:12.5px;margin-top:2px}
  @media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}}

  /* sections */
  .grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;align-items:start}
  @media(max-width:860px){.grid2{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
  .card h2{font-size:16px;margin:0 0 4px}
  .card .cap{color:var(--muted);font-size:13px;margin-bottom:14px}
  .section{margin:34px 0}
  .section>h2{font-size:19px;margin:0 0 4px}
  .section>.cap{color:var(--muted);font-size:13.5px;margin-bottom:16px}

  /* train rows */
  .trow{display:flex;align-items:center;gap:14px;padding:13px 4px;border-bottom:1px solid var(--border);cursor:pointer;border-radius:8px}
  .trow:hover{background:var(--panel2)}
  .trow:last-child{border-bottom:0}
  .trow .num{font-weight:800;font-size:13px;color:var(--sky);min-width:56px}
  .trow .nm{flex:1;min-width:0}
  .trow .nm .a{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .trow .nm .r{color:var(--muted);font-size:12.5px}
  .trow .meta{text-align:right;font-size:12.5px;color:var(--muted)}
  .trow .meta b{color:var(--text)}

  /* badges */
  .badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:800;letter-spacing:.3px}
  .badge .bdot{width:8px;height:8px;border-radius:50%;background:currentColor}
  .b-low{color:var(--low);background:rgba(34,197,94,.12)}
  .b-mod{color:var(--mod);background:rgba(56,189,248,.12)}
  .b-high{color:var(--high);background:rgba(245,158,11,.12)}
  .b-crit{color:var(--crit);background:rgba(239,68,68,.14)}
  .tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;background:var(--panel2);color:var(--muted);border:1px solid var(--border)}

  /* occupancy bar */
  .obar{height:10px;border-radius:99px;background:#0b1322;overflow:hidden;border:1px solid var(--border)}
  .obar>i{display:block;height:100%;border-radius:99px;transition:width .6s ease}

  /* train detail */
  .td-head{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;justify-content:space-between}
  .td-head h1{font-size:22px;margin:6px 0 4px}
  .td-head .route{color:var(--muted);font-size:14px}
  .livecard{display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center;
    background:linear-gradient(120deg,#131f36,#0f1830);border:1px solid var(--border);border-radius:var(--radius);padding:22px}
  @media(max-width:760px){.livecard{grid-template-columns:1fr}}
  .bigpct{font-size:46px;font-weight:900;line-height:1}
  .livecard .sub{color:var(--muted);font-size:13px}
  .kv{display:grid;grid-template-columns:auto auto;gap:6px 22px;font-size:13.5px}
  .kv .k{color:var(--muted)}
  .kv .v{font-weight:700}

  /* sparkline */
  .spark{width:100%;height:44px}
  .spark polyline{fill:none;stroke:var(--sky);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
  .spark .area{fill:rgba(56,189,248,.12);stroke:none}

  /* class cards */
  .classes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .cl{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
  .cl .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .cl .top .nm{font-weight:700;font-size:14px}
  .cl .top .pct{font-weight:900;font-size:17px}
  .coachgrid{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
  .coach{width:26px;height:30px;border-radius:6px;display:grid;place-items:center;font-size:10px;font-weight:800;color:#0b1220}
  .coach.lbl{background:transparent;color:var(--muted);width:auto}

  /* map */
  .mapwrap{position:relative}
  .mapbox{background:#0b1322;border:1px solid var(--border);border-radius:var(--radius);padding:10px}
  .mapbox svg{width:100%;height:auto;display:block}
  .mapctrl{position:absolute;top:14px;right:14px;display:flex;gap:6px;z-index:5}
  .mc{background:rgba(13,20,36,.88);border:1px solid var(--border);color:var(--muted);font-size:11.5px;font-weight:700;padding:6px 11px;border-radius:8px;cursor:pointer;backdrop-filter:blur(4px)}
  .mc:hover{color:var(--text)}
  .mc.on{background:var(--accent);color:#1a1206;border-color:var(--accent)}
  .state{fill:#0f1a2e;stroke:#223653;stroke-width:0.7;stroke-linejoin:round}
  .outline{fill:none;stroke:#48648f;stroke-width:1.7;stroke-linejoin:round}
  .route{fill:none;stroke:var(--accent);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round;opacity:.95}
  .route-glow{fill:none;stroke:rgba(255,122,24,.22);stroke-width:8;stroke-linejoin:round;stroke-linecap:round}
  .stop{fill:var(--sky);stroke:#0b1322;stroke-width:1.2}
  .cur-ring{fill:none;stroke:var(--accent);stroke-width:2}
  .stop.end{fill:var(--accent)}
  .cur{fill:#fff;stroke:var(--accent);stroke-width:2.5}
  .maplabel{font-size:10.5px;fill:#9fb4d8;font-weight:600}
  .mapstop-label{font-size:9.5px;fill:#7f93b5}

  /* schedule table */
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px;padding:8px 10px;border-bottom:1px solid var(--border)}
  td{padding:9px 10px;border-bottom:1px solid var(--border)}
  tr:hover td{background:var(--panel2)}
  .now-row td{background:rgba(255,122,24,.1)}

  /* news */
  .filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
  .chip{padding:6px 13px;border-radius:99px;border:1px solid var(--border);background:var(--panel);color:var(--muted);
    font-size:12.5px;font-weight:700;cursor:pointer}
  .chip.on{background:var(--accent);color:#1a1206;border-color:var(--accent)}
  .newsitem{padding:14px 2px;border-bottom:1px solid var(--border)}
  .newsitem:last-child{border-bottom:0}
  .newsitem .nt{font-weight:600;font-size:14.5px;margin:2px 0 4px}
  .newsitem .nt a{color:var(--text)}
  .newsitem .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin-top:6px}
  .imphigh{border-left:3px solid var(--crit);padding-left:12px}
  .impmedium{border-left:3px solid var(--high);padding-left:12px}
  .implow{border-left:3px solid var(--sky);padding-left:12px}

  .srcbar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:#0b1322;border:1px solid var(--border)}
  .srcbar>i{height:100%}
  .srclist{display:grid;gap:8px;margin-top:12px}
  .srclist .s{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
  .srclist .sw{width:10px;height:10px;border-radius:3px}

  .foot{margin:50px 0 30px;padding-top:20px;border-top:1px solid var(--border);color:var(--muted);font-size:12.5px;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between}
  .note{background:rgba(56,189,248,.07);border:1px solid rgba(56,189,248,.25);border-radius:12px;padding:13px 16px;font-size:13px;color:#bcd7f5;margin:16px 0}
  .note b{color:var(--sky)}
  .arch{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:16px 0}
  .arch .box{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px}
  .arch .box .h{font-weight:800;font-size:13.5px;margin-bottom:5px;display:flex;align-items:center;gap:7px}
  .arch .box .d{font-size:12.5px;color:var(--muted)}
  .pill-true{background:rgba(34,197,94,.15);color:var(--low);border:1px solid rgba(34,197,94,.35)}
  .pill-sim{background:rgba(255,122,24,.15);color:var(--accent);border:1px solid rgba(255,122,24,.35)}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:rot .8s linear infinite;vertical-align:-3px}
  @keyframes rot{to{transform:rotate(360deg)}}
  .err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#fca5a5;border-radius:12px;padding:14px 16px;margin:16px 0}

  /* community reports */
  .rep{padding:14px 2px;border-bottom:1px solid var(--border)}
  .rep:last-child{border-bottom:0}
  .rep-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .rep-m{margin:8px 0 6px;font-size:14px}
  .rep-f{display:flex;align-items:center;gap:10px}
  .vbtn{background:var(--panel2);border:1px solid var(--border);color:var(--muted);font-size:12px;font-weight:700;
    padding:5px 11px;border-radius:8px;cursor:pointer}
  .vbtn:hover{color:var(--text);border-color:var(--sky)}
  .vbtn.voted{color:var(--low);border-color:rgba(34,197,94,.4);cursor:default}
  .rform{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .rform select,.rform input,.rform textarea{background:var(--panel2);border:1px solid var(--border);border-radius:10px;
    color:var(--text);padding:11px 13px;font-size:14px;outline:none;font-family:inherit}
  .rform textarea{grid-column:1/-1;resize:vertical}
  .rform select:focus,.rform input:focus,.rform textarea:focus{border-color:var(--accent)}
  .rform .btn{grid-column:1/-1}
  .btn{background:var(--accent);color:#1a1206;border:0;border-radius:10px;padding:11px 18px;font-weight:800;font-size:14px;cursor:pointer}
  .btn:hover{filter:brightness(1.08)}
  .btn:disabled{opacity:.6;cursor:default}
  @media(max-width:640px){.rform{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="wrap hdr">
    <button class="backbtn" id="backbtn" onclick="goBack()" title="Back" aria-label="Back">←</button>
    <div class="brand" onclick="location.hash='#/'">
      <div class="logo">RC</div>
      <div>
        <div class="t">Rail<span>Crowd</span></div>
        <div class="sub">Real-time crowding · Indian Railways</div>
      </div>
    </div>
    <nav id="nav">
      <a href="#/" data-r="home">Home</a>
      <a href="#/trains" data-r="trains">Trains</a>
      <a href="#/stations" data-r="stations">Stations</a>
      <a href="#/news" data-r="news">Live News</a>
      <a href="#/community" data-r="community">Community</a>
      <a href="#/data" data-r="data">Data</a>
    </nav>
    <span class="livepill" id="livepill"><span class="dot"></span>LIVE</span>
  </div>
</header>

<main class="wrap" id="app">
  <div style="padding:40px 0"><span class="spin"></span>&nbsp; Loading…</div>
</main>

<footer class="wrap foot">
  <div>RailCrowd — hackathon prototype. Not affiliated with Indian Railways or IRCTC.</div>
  <div>Static reference data: public datasets · News: Google News RSS (live) · Crowding: explainable model</div>
</footer>

const MAPW = 1000, MAPH = 660;
let mapMode = "route";
let mapState = null;

function boundsOf(rings){
  let minLat=1e9, maxLat=-1e9, minLon=1e9, maxLon=-1e9;
  for(const r of rings){ for(let i=0;i<r.length;i++){ const la=r[i][0], lo=r[i][1];
    if(la<minLat)minLat=la; if(la>maxLat)maxLat=la;
    if(lo<minLon)minLon=lo; if(lo>maxLon)maxLon=lo; } }
  return {minLat, maxLat, minLon, maxLon};
}
const INDIA_BOUNDS = boundsOf(INDIA_OUTLINE);

function makeProj(b){
  const midLat=(b.minLat+b.maxLat)/2, cos=Math.max(0.3, Math.cos(midLat*Math.PI/180));
  const w=Math.max((b.maxLon-b.minLon)*cos, 0.12), h=Math.max(b.maxLat-b.minLat, 0.12);
  const scale=Math.min(MAPW*0.82/w, MAPH*0.82/h);
  const cx=(b.minLon+b.maxLon)/2, cy=(b.minLat+b.maxLat)/2;
  return {
    Px: lo => (lo-cx)*cos*scale + MAPW/2,
    Py: la => (cy-la)*scale + MAPH/2,
  };
}
function ringPath(rings, P){
  let d="";
  for(const r of rings){
    let s="";
    for(let i=0;i<r.length;i++) s += (i?",":"") + P.Px(r[i][1]).toFixed(1)+","+P.Py(r[i][0]).toFixed(1);
    d += "M"+s+"Z";
  }
  return d;
}

  document.querySelectorAll("nav a").forEach(a=> a.classList.toggle("on", a.dataset.r===r));
}
function goBack(){
  if(BACKSTACK.length){ const p = BACKSTACK.pop(); LASTHASH = p; location.hash = p; }
  else location.hash = "#/";
}
async function route(){
  if(TICKER){ clearInterval(TICKER); TICKER=null; }
  const h = location.hash || "#/";
  if(h !== LASTHASH){ BACKSTACK.push(LASTHASH); if(BACKSTACK.length>40) BACKSTACK.shift(); LASTHASH = h; }
  setNav(h.split("/")[1] || "home");
  const bb = $("backbtn");
  if(bb) bb.style.display = (h === "#/") ? "none" : "flex";
  try{
    if(h.startsWith("#/train/")) return await renderTrain(h.split("/")[2]);
    if(h.startsWith("#/station/")) return await renderStation(h.split("/")[2]);
    if(h.startsWith("#/trains")) return renderTrainSearch();
    if(h.startsWith("#/stations")) return renderStationSearch();
    if(h.startsWith("#/news")) return renderNews();
    if(h.startsWith("#/community")) return renderCommunity();
    if(h.startsWith("#/data")) return renderData();
    return renderHome();
  }catch(e){ app.innerHTML = `<div class="err">Something went wrong: ${esc(e.message)}</div>`; }
}
window.addEventListener("hashchange", route);

}
function cacheSet(key, data){
  try{ localStorage.setItem(key, JSON.stringify({at:Date.now(), data})); }catch(e){}

/* ============================== SEARCH ================================ */
function bindSearch(){
  const q = $("q"); if(!q) return;
  const box = $("sugbox");
  let t;
  q.addEventListener("input", ()=>{
    clearTimeout(t);
    const v = q.value.trim();
    if(v.length < 2){ box.style.display="none"; return; }
    t = setTimeout(async ()=>{
      try{
        const [st, tr] = await Promise.all([
          api(`/api/stations/search?q=${encodeURIComponent(v)}`),
          api(`/api/trains/search?q=${encodeURIComponent(v)}`)
        ]);
        const rows = [];
        st.slice(0,5).forEach(s=> rows.push(
          `<div class="row" onclick="location.hash='#/station/${s.code}'"><span class="kind st">STN</span><span class="nm">${esc(s.name)}</span><span class="sub2">${esc(s.code)} · ${esc(s.state)}</span></div>`));
        tr.slice(0,5).forEach(t2=> rows.push(
          `<div class="row" onclick="location.hash='#/train/${t2.number}'"><span class="kind">TRN</span><span class="nm">${esc(t2.number)} ${esc(t2.name)}</span><span class="sub2">${esc(t2.from_name)}→${esc(t2.to_name)}</span></div>`));
        box.innerHTML = rows.length? rows.join("") : `<div class="row"><span class="sub2">No matches for “${esc(v)}”</span></div>`;
        box.style.display = "block";
      }catch(e){ box.style.display="none"; }
    }, 180);
  });
  document.addEventListener("click", e=>{ if(!e.target.closest(".sug")) box.style.display="none"; });
  q.addEventListener("keydown", e=>{ if(e.key==="Enter") doSearch(); });
}
function doSearch(){
  const v = $("q").value.trim();
  if(!v) return;
  if(/^\d{3,5}$/.test(v)){ location.hash = `#/train/${v}`; }
  else { location.hash = `#/trains?q=${encodeURIComponent(v)}`; }
}

        <b style="color:#a78bfa">Community impact:</b> ${comm.count} recent report${comm.count!==1?"s":""} from passengers
        ${comm.boost>0?`· crowding <b style="color:#a78bfa">+${Math.round(comm.boost*100)}%</b>`:""}
        ${comm.delay>0?`· delay <b style="color:#a78bfa">+${comm.delay} min</b>`:""}
        — this train's estimate already reflects them.
      </div>`:""}
    <div class="card">${renderReportList(reps, "No reports yet for this train — be the first to share.")}</div>
    ${reportFormHTML(number, "")}
  </div>
  `;

  drawSpark(live.delay ? live.delay_trend : [0]);
  drawMap(t, pr, stops, "route");

  // countdown auto-refresh (single managed ticker)
  let s = 60;
  TICKER = setInterval(()=>{ const el=$("tick"); if(el){ s--; if(s<=0){ s=60; location.hash=location.hash; } else el.textContent=s; } },1000);
}

function crowdAtStop(code, i, n){
  // deterministic-ish station crowding using hash of code
  let h = 0; for(const c of code) h = (h*31 + c.charCodeAt(0))>>>0;
  const v = (h % 1000)/1000;
  return v>=0.85?"Critical":v>=0.6?"High":v>=0.35?"Moderate":"Low";
}
function crowdPct(code){
  let h = 0; for(const c of code) h = (h*31 + c.charCodeAt(0))>>>0;
  return ((h % 70) + 20)/100;
}

/* ============================== MAP =================================== */
function drawMap(t, pr, stops, mode){
  const box = $("mapbox"); if(!box) return;
  mapState = {t, pr, stops};
  if(mode) mapMode = mode;
  const route = (t.route && t.route.length>1)? t.route : stops.map(s=>[s.lat,s.lon]);
  const b = mapMode==="india" ? INDIA_BOUNDS : boundsOf([route]);
  const P = makeProj(b);
  const statePaths = INDIA_STATES.map(s=>`<path class="state" d="${ringPath(s.r,P)}"/>`).join("");
  const outlinePath = `<path class="outline" d="${ringPath(INDIA_OUTLINE,P)}"/>`;
  const routePts = route.map(p=>`${P.Px(p[1]).toFixed(1)},${P.Py(p[0]).toFixed(1)}`).join(" ");
  let cur = "";
  if(pr.fraction!=null && route.length>1){
    const f = Math.max(0, Math.min(1, pr.fraction));
    const i = Math.floor(f*(route.length-1));
    const j = Math.min(route.length-1, i+1);
    const la = route[i][0]+(route[j][0]-route[i][0])*(f*(route.length-1)-i);
    const lo = route[i][1]+(route[j][1]-route[i][1])*(f*(route.length-1)-i);
    cur = `<g><circle class="cur-ring" cx="${P.Px(lo).toFixed(1)}" cy="${P.Py(la).toFixed(1)}" r="9">
      <animate attributeName="r" values="5;14;5" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.1;0.9" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle class="cur" cx="${P.Px(lo).toFixed(1)}" cy="${P.Py(la).toFixed(1)}" r="5"/></g>`;
  }
  const shown = stops.length>30? stops.filter((_,i)=> i%2===0 || i===stops.length-1) : stops;
  const dots = shown.map(s=>{
    const e = s.code===t.from_code||s.code===t.to_code;
    return `<circle class="stop ${e?'end':''}" cx="${P.Px(s.lon).toFixed(1)}" cy="${P.Py(s.lat).toFixed(1)}" r="${e?4.5:2.8}"/>`;
  }).join("");
  const labels = [stops[0], stops[stops.length-1]].filter(Boolean).map(s=>
    `<text class="maplabel" x="${P.Px(s.lon).toFixed(1)}" y="${(P.Py(s.lat)-9).toFixed(1)}">${esc(s.name.split(" ").slice(0,2).join(" "))}</text>`).join("");
  box.innerHTML = `<svg viewBox="0 0 ${MAPW} ${MAPH}" xmlns="http://www.w3.org/2000/svg">
    ${statePaths}
    ${outlinePath}
    ${routePts?`<polyline class="route-glow" points="${routePts}"/><polyline class="route" points="${routePts}"/>`:""}
    ${dots} ${labels} ${cur}
  </svg>`;
  document.querySelectorAll(".mc").forEach(btn=> btn.classList.toggle("on", btn.dataset.m===mapMode));
}
function setMapMode(m){ if(mapState) drawMap(mapState.t, mapState.pr, mapState.stops, m); }

function drawSpark(series){
  const el = $("spark"); if(!el) return;
  const arr = series.length? series : [0,0];
  const W=180,H=44,pad=3;
  const mx = Math.max(4, ...arr);
  const pts = arr.map((v,i)=>{
    const x = pad + i*(W-2*pad)/Math.max(1,arr.length-1);
    const y = H-pad-(v/mx)*(H-2*pad);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  });
  el.innerHTML = `<polyline points="${pts.join(" ")}"/>
    <polygon class="area" points="${pad},${H-pad} ${pts.join(" ")} ${(W-pad)},${H-pad}"/>`;
}

function ageLabel(m){
  if(m==null || m===undefined) return "";
  if(m < 60) return Math.max(1,Math.round(m))+"m ago";
  if(m < 60*24) return Math.round(m/60)+"h ago";
  return Math.round(m/(60*24))+"d ago";
}

  const list = items.slice(0, cap||items.length);

      <div class="meta">

        <span class="badge ${it.impact==='high'?'b-crit':it.impact==='medium'?'b-high':'b-mod'}"><span class="bdot"></span>${esc(it.category)}</span>

        ${(it.stations||[]).slice(0,2).map(s=>`<span class="tag">📍 ${esc(s.code)}</span>`).join("")}
      </div>
    </div>`}).join("");
}

function ageAgo(iso){
  if(!iso) return "";
  try{ const d = new Date(iso); if(isNaN(d)) return "";
    const m = Math.max(0,(Date.now()-d.getTime())/60000);
    if(m<60) return Math.max(1,Math.round(m))+"m ago";
    if(m<1440) return Math.round(m/60)+"h ago";
    return Math.round(m/1440)+"d ago"; }catch(e){ return ""; }
}
function repColor(t){
  return ({overcrowded_platform:"b-crit", no_space_train:"b-crit", rain_platform:"b-high",
    coach_issue:"b-high", security:"b-crit", delayed_train:"b-mod", cleanliness:"b-low", other:"b-mod"})[t]||"b-mod";
}

async function submitReport(defTrain, defStation){
  const type = ($("rpt-type")||{}).value || "other";
  const train = (($("rpt-train")||{}).value||"").trim() || defTrain || "";
  const station = (($("rpt-station")||{}).value||"").trim() || defStation || "";
  const message = (($("rpt-msg")||{}).value||"").trim();
  if(!message){ alert("Please describe the issue."); return; }
  const btn = $("rpt-submit"); if(btn) btn.disabled = true;
  try{
    const r = await fetch("/api/reports", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({type, train, station, message})});
    const j = await r.json().catch(()=>({}));
    if(!r.ok){ alert(j.error || "Could not submit report."); return; }
    route();  // re-render current page with fresh data
  }catch(e){ alert("Network error — could not submit."); }
  finally{ if(btn) btn.disabled = false; }
}
